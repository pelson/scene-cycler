name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version custom_components/scene_cycler/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Extract release notes from CHANGELOG.md
        run: |
          # The section under "## <version>", up to the next "## " heading.
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No CHANGELOG.md section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
